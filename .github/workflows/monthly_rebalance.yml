name: Monthly Rebalance

on:
  schedule:
    - cron: '35 13 1-7 * 1'   # 每月 1~7 日的週一，UTC 13:35 = EST 09:35
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (true = 不實際下單)'
        required: false
        default: 'false'

jobs:
  monthly-rebalance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monthly rebalance
        env:
          ALPACA_KEY_ACC001:    ${{ secrets.ALPACA_KEY_ACC001 }}
          ALPACA_SECRET_ACC001: ${{ secrets.ALPACA_SECRET_ACC001 }}
          ALPACA_KEY_ACC002:    ${{ secrets.ALPACA_KEY_ACC002 }}
          ALPACA_SECRET_ACC002: ${{ secrets.ALPACA_SECRET_ACC002 }}
          EMAIL_SENDER:         ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD:       ${{ secrets.EMAIL_PASSWORD }}
          DRY_RUN:              ${{ github.event.inputs.dry_run || 'false' }}
        run: python -m src.runner.daily_trader --rebalance

      - name: Upload rebalance log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rebalance-log-${{ github.run_id }}
          path: logs/
          retention-days: 90
